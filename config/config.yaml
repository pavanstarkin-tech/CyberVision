project:
  name: "CyberVision"
  version: "1.0.0"
  description: "Explainable AI-Based Platform for Multi-Layer Cyber Threat Detection"

storage:
  duckdb_path: "data/processed/cybervision_ecs.duckdb"
  cache_db_path: "data/cache/cti_cache.sqlite"
  parquet_dir: "data/processed"
  raw_dir: "data/raw"
  results_dir: "results"
  figures_dir: "results/figures"

detection:
  hybrid_alpha: 0.65 # Weight for supervised model confidence (1-alpha for anomaly)
  anomaly_threshold_quantile: 0.95
  random_state: 42
  temporal_window_minutes: 5

severity_thresholds:
  low_max: 39.0
  medium_max: 69.0
  high_max: 89.0
  critical_max: 100.0

correlation_weights:
  w1_peak_confidence: 0.45
  w2_layer_concurrence: 0.25
  w3_mitre_progression: 0.15
  w4_cti_reputation: 0.15

xai:
  top_k_features: 5
  faithfulness_k_values: [1, 3, 5]
  perturbation_noise_sigma: 0.01

api:
  host: "127.0.0.1"
  port: 8000

dashboard:
  port: 8501

